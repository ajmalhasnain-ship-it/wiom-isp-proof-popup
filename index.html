<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>ISP रिचार्ज प्रूफ़ — सूचना</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;500;600;700;800;900&display=swap');
:root{ --brand:#D9008D; }
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;
  font-family:'Noto Sans Devanagari','Noto Sans','Segoe UI',system-ui,sans-serif;
  background:var(--brand);color:#fff;overflow:hidden;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer}

/* ── Full-page pop-up · solid pink (no gradient) ── */
.blocker{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;background:var(--brand);
  padding:calc(40px + env(safe-area-inset-top)) 24px calc(96px + env(safe-area-inset-bottom))}

/* ── In-phone "upload proof" animation (loops) ── */
.device{position:relative;z-index:1;width:132px;height:250px;margin:0 auto 22px;background:#fff;border-radius:30px;
  padding:7px;box-shadow:0 16px 34px rgba(0,0,0,.24),0 0 64px rgba(255,255,255,.16);
  animation:float 4.5s ease-in-out infinite;margin-bottom:32px}
.device::before{content:"";position:absolute;left:-2px;top:56px;width:3px;height:20px;border-radius:2px;background:#EAE0E8}
.device::after{content:"";position:absolute;right:-2px;top:76px;width:3px;height:34px;border-radius:2px;background:#EAE0E8}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.device .screen{position:relative;width:100%;height:100%;background:#FCEFF7;border-radius:24px;overflow:hidden;
  display:flex;flex-direction:column;align-items:center}
.statusbar{position:absolute;top:0;left:0;right:0;height:24px;display:flex;align-items:center;justify-content:space-between;
  padding:7px 12px 0;font-size:9px;font-weight:700;color:#9A7789;letter-spacing:.2px;z-index:5}
.bat{position:relative;display:inline-block;width:15px;height:8px;border:1.2px solid #9A7789;border-radius:2px}
.bat::after{content:"";position:absolute;right:-3px;top:2px;width:2px;height:3px;background:#9A7789;border-radius:0 1px 1px 0}
.bat i{position:absolute;left:1px;top:1px;bottom:1px;width:70%;background:#9A7789;border-radius:1px}
.notch{position:absolute;top:9px;left:50%;transform:translateX(-50%);width:44px;height:11px;border-radius:6px;
  background:#2b2130;z-index:7}
.notch::after{content:"";position:absolute;right:7px;top:50%;transform:translateY(-50%);width:4px;height:4px;
  border-radius:50%;background:#5b4a54}
.homebar{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:48px;height:4px;border-radius:2px;
  background:rgba(43,33,48,.32);z-index:6}
.proof{width:76px;background:#fff;border:1px solid #F3C7E4;border-radius:8px;padding:9px}
.proof i{display:block;height:4px;width:100%;border-radius:2px;background:#F3C7E4;margin-bottom:6px}
.proof i.short{width:58%}
.proof .chip{height:10px;width:44%;border-radius:3px;background:#D9008D;margin-top:2px}
/* cross-fading stages: capture → submit → progress → done (loops) */
.st{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:12px;padding:14px 6px;opacity:0}
.st.cap {animation:fcap  5.5s ease-in-out infinite}
.st.sub {animation:fsub  5.5s ease-in-out infinite}
.st.prog{animation:fprog 5.5s ease-in-out infinite}
.st.done{animation:fdone 5.5s ease-in-out infinite}
/* capture (camera) */
.vf{position:relative;width:82px;background:#fff;border-radius:8px;padding:11px}
.vf i{display:block;height:4px;width:100%;border-radius:2px;background:#F3C7E4;margin-bottom:6px}
.vf i.short{width:58%}
.vf .chip{height:9px;width:44%;border-radius:3px;background:#D9008D}
/* camera focus corner brackets */
.cnr{position:absolute;width:14px;height:14px;border:2.5px solid #D9008D}
.cnr.tl{top:-6px;left:-6px;border-right:0;border-bottom:0;border-top-left-radius:4px}
.cnr.tr{top:-6px;right:-6px;border-left:0;border-bottom:0;border-top-right-radius:4px}
.cnr.bl{bottom:-6px;left:-6px;border-right:0;border-top:0;border-bottom-left-radius:4px}
.cnr.br{bottom:-6px;right:-6px;border-left:0;border-top:0;border-bottom-right-radius:4px}
.flash{position:absolute;inset:0;background:#fff;opacity:0;border-radius:8px;animation:flash 5.5s ease-in-out infinite}
.shutter{width:34px;height:34px;border-radius:50%;background:#fff;border:3px solid #D9008D;
  box-shadow:inset 0 0 0 2px #fff;margin-top:16px;animation:shutter 5.5s ease-in-out infinite}
/* upload button */
.upbtn{background:#D9008D;color:#fff;font-size:11px;font-weight:700;padding:8px 13px;border-radius:9px;
  white-space:nowrap;box-shadow:0 4px 10px rgba(217,0,141,.3);animation:tap 5.5s ease-in-out infinite}
/* progress */
.bar{width:86px;height:8px;background:#F3C7E4;border-radius:5px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:#D9008D;border-radius:5px;animation:fill 5.5s ease-in-out infinite}
.plabel{font-size:11px;color:#8A5B76;font-weight:600}
/* done */
.tick{width:38px;height:38px;border-radius:50%;background:#008043;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 14px rgba(0,128,67,.32)}
.donetxt{font-size:14px;color:#008043;font-weight:700}
@keyframes fcap {0%{opacity:1}24%{opacity:1}29%{opacity:0}100%{opacity:0}}
@keyframes flash{0%,9%{opacity:0}14%{opacity:.9}20%{opacity:0}100%{opacity:0}}
@keyframes shutter{0%,9%{transform:scale(1)}14%{transform:scale(.82)}20%{transform:scale(1)}100%{transform:scale(1)}}
@keyframes fsub {0%,29%{opacity:0}33%{opacity:1}44%{opacity:1}48%{opacity:0}100%{opacity:0}}
@keyframes tap {0%,36%{transform:scale(1)}40%{transform:scale(.9)}44%{transform:scale(1)}100%{transform:scale(1)}}
@keyframes fprog{0%,47%{opacity:0}51%{opacity:1}71%{opacity:1}75%{opacity:0}100%{opacity:0}}
@keyframes fill {0%,49%{width:0}70%{width:100%}75%{width:100%}76%{width:0}100%{width:0}}
@keyframes fdone{0%,74%{opacity:0;transform:scale(.5)}80%{opacity:1;transform:scale(1.12)}85%{transform:scale(.97)}89%{opacity:1;transform:scale(1)}92%{opacity:1;transform:scale(1)}97%{opacity:0}100%{opacity:0}}

/* ── Copy · T2_24_Bold ── */
.title{font-size:25px;font-weight:700;line-height:1.48;letter-spacing:-.2px;max-width:296px;color:#fff;
  text-wrap:balance;text-shadow:0 1px 2px rgba(0,0,0,.12);animation:rise .45s .15s both}

/* ── CTA bar · white button, pink text ── */
.ctabar{position:fixed;bottom:0;left:0;right:0;z-index:30;background:var(--brand);
  padding:16px 16px calc(20px + env(safe-area-inset-bottom));
  animation:rise .45s .3s both}
.btn{display:block;width:100%;max-width:328px;margin:0 auto;padding:14px;
  border-radius:16px;border:none;font-size:16px;font-weight:700}
.btn-primary{background:#fff;color:var(--brand);box-shadow:0 8px 20px rgba(0,0,0,.18)}
.btn-primary:active{transform:scale(.98)}

@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body>

<section class="blocker">
  <div class="device" aria-hidden="true">
    <div class="screen">
      <div class="statusbar"><span>9:41</span><span class="bat"><i></i></span></div>
      <!-- 1 · capture: photo of the recharge is clicked -->
      <div class="st cap">
        <div class="vf">
          <i></i><i></i><i class="short"></i><div class="chip"></div>
          <span class="cnr tl"></span><span class="cnr tr"></span><span class="cnr bl"></span><span class="cnr br"></span>
          <div class="flash"></div>
        </div>
        <div class="shutter"></div>
      </div>
      <!-- 2 · submit proof -->
      <div class="st sub">
        <div class="proof"><i></i><i></i><i class="short"></i><div class="chip"></div></div>
        <div class="upbtn">प्रूफ़ सबमिट करें</div>
      </div>
      <!-- 3 · uploading -->
      <div class="st prog">
        <div class="proof"><i></i><i></i><i class="short"></i><div class="chip"></div></div>
        <div class="bar"><i></i></div>
        <div class="plabel">अपलोड हो रहा है…</div>
      </div>
      <!-- 4 · submitted -->
      <div class="st done">
        <div class="tick"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4 10-11"/></svg></div>
        <div class="donetxt">प्रूफ़ सबमिट हो गया</div>
      </div>
    </div>
    <div class="notch"></div>
    <div class="homebar"></div>
  </div>

  <div class="title"><span id="date">25 सितंबर</span> से आपको हर कनेक्शन लगाने पर ISP रिचार्ज का प्रूफ़ देना होगा।</div>
</section>

<div class="ctabar">
  <button class="btn btn-primary" data-act="dismiss">ठीक है</button>
</div>

<script>
(function(){
  // ── Date injected by CleverTap (key: date) → URL ?date= → default ──
  function str(token, param, def){
    if(token.indexOf('{{') === -1 && token.trim() !== '') return token;
    return new URLSearchParams(location.search).get(param) || def;
  }
  document.getElementById('date').textContent = str('{{date}}', 'date', '25 सितंबर');

  // ── ठीक है closes the pop-up (CleverTap: map to "close") ──
  document.querySelector('[data-act="dismiss"]').addEventListener('click', function(){
    if(window.CleverTap && CleverTap.dismiss) CleverTap.dismiss();
    else window.close();
  });
})();
</script>
</body>
</html>
